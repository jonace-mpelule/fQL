name: Extended verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extended:
    name: Extended verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          git clone --depth 1 --branch 3.41.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: npm ci --no-fund
      - run: npx playwright install --with-deps chromium
      - run: make check-all test-race
      - name: Short parser fuzz checks
        run: |
          go test ./tests/compiler -run='^$' -fuzz=FuzzParser -fuzztime=15s
          go test ./tests/compiler -run='^$' -fuzz=FuzzPolicyParser -fuzztime=5s
      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed examples/flutter/lib tests/dart
      - run: npm run test:typescript:emulator
      - name: Compile Flutter example
        working-directory: examples/flutter
        run: flutter build web --no-pub
