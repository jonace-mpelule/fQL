name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix (for example 0.1.0-dev.3)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build, verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          FQL_RELEASE_VERSION: ${{ inputs.version }}
        run: go run ./tools/publish --version "$FQL_RELEASE_VERSION"
