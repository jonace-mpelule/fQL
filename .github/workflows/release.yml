name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix (for example 0.1.0-dev.3)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build, verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          FQL_RELEASE_VERSION: ${{ inputs.version }}
        run: go run ./tools/publish --version "$FQL_RELEASE_VERSION"
