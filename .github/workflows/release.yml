name: Build release archives

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix (for example 0.1.0-dev.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  archives:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - run: make check generate-check
      - name: Build archives
        env:
          FQL_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          go run ./tools/release --version "$FQL_RELEASE_VERSION"
          python3 tests/release/verify_archives.py --version "$FQL_RELEASE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fql-cli
          path: dist/
          if-no-files-found: error
